version: 2.1

executors:
  mac:
    macos:
      xcode: 16.0.0
    environment:
      TEAM_ID: "22X77ENQ2H"
      APPLE_ID: "puzznic@inka.co.kr"
      CERTIFICATE_PASSWORD: "123456"
      APP_SPECIFIC_PASSWORD: "qbrz-hmfz-robj-eohm"
      PROVISIONING_PROFILE_NAME: "AppSealing Wildcard Distribution Profile"
    working_directory: ~/project

jobs:
  build_and_deploy:
    executor: mac
    steps:
      - checkout
      
      - run:
          name: Install Dependencies
          command: |
            npm install -g @ionic/cli
            npm install
            
      - run:
          name: Build Ionic Project
          command: |
            ionic build
            ionic capacitor sync ios
            
      - run:
          name: Install Certificates
          command: |
            mkdir -p /Users/distiller/Library/Developer/Xcode/UserData/Provisioning\ Profiles/
            cp /Users/distiller/project/ios/App/profile.mobileprovision /Users/distiller/Library/Developer/Xcode/UserData/Provisioning\ Profiles/
            security create-keychain -p "circle" build.keychain
            security import /Users/distiller/project/ios/App/distribution.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security list-keychains -s build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "circle" build.keychain
            security set-keychain-settings -t 3600 -u build.keychain
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "circle" build.keychain
            
      - run:
          name: Update Build Number
          command: |
            cd ios/App
            agvtool new-version -all $CIRCLE_BUILD_NUM
            
      - run:
          name: Extract Bundle ID
          command: |
            cd ios/App
            BUNDLE_ID=$(grep -A1 "PRODUCT_BUNDLE_IDENTIFIER" App.xcodeproj/project.pbxproj | grep -v PRODUCT_BUNDLE_IDENTIFIER | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            echo "export BUNDLE_ID=$BUNDLE_ID" >> $BASH_ENV
            source $BASH_ENV
            
      - run:
          name: Create exportOptions.plist
          command: |
            cat > ios/App/exportOptions.plist \<< EOF
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>method</key>
                <string>app-store</string>
                <key>teamID</key>
                <string>${TEAM_ID}</string>
                <key>signingStyle</key>
                <string>manual</string>
                <key>provisioningProfiles</key>
                <dict>
                    <key>${BUNDLE_ID}</key>
                    <string>${PROVISIONING_PROFILE_NAME}</string>
                </dict>
            </dict>
            </plist>
            EOF
            
      - run:
          name: Build iOS App
          command: |
            cd ios/App
            xcodebuild clean archive \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -archivePath build/App.xcarchive \
              CODE_SIGN_STYLE=Manual \
              PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME" \
              CODE_SIGN_IDENTITY="iPhone Distribution"
              
      - run:
          name: Export IPA
          command: |
            cd ios/App
            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportOptionsPlist exportOptions.plist \
              -exportPath build/App.ipa
              
      - run:
          name: Upload to TestFlight
          command: |
            xcrun altool --upload-app \
              -f ios/App/build/App.ipa/App.ipa \
              -t ios \
              --apple-id "$APPLE_ID" \
              --password "$APP_SPECIFIC_PASSWORD"

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build_and_deploy:
          filters:
            branches:
              only: circleci-project-setup
